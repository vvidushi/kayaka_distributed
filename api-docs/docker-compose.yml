services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.12
    container_name: kayak-api-docs-swagger
    restart: unless-stopped
    ports:
      - '8081:8080'
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
      BASE_URL: /
    volumes:
      - ./openapi.yaml:/tmp/openapi.yaml:ro
  redoc:
    image: redocly/redoc:latest
    container_name: kayak-api-docs-redoc
    restart: unless-stopped
    ports:
      - '8082:80'
    environment:
      SPEC_URL: /openapi.yaml
    volumes:
      - ./openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
