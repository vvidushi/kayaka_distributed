        - WY
      description: Two-letter postal abbreviation for US states.
    DealEvent:
      type: object
      required:
        - eventId
        - occurredAt
        - topic
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        topic:
          type: string
        payload:
          type: object
          required: [dealId, score, tags, price, listingType]
          properties:
            dealId:
              type: string
              format: uuid
            listingType:
              type: string
              enum: [flight, hotel]
            listingId:
              type: string
            score:
              type: integer
              minimum: 0
              maximum: 100
            tags:
              type: array
              items:
                type: string
            price:
              $ref: '#/components/schemas/Money'
            availability:
              type: integer
              minimum: 0
            promotionEndsAt:
              type: string
              format: date-time
            summary:
              type: string
              maxLength: 160
webhooks:
  deal.events:
    post:
      summary: Deal events stream
      description: Kafka-backed webhook representing deal updates propagated to external listeners.
      operationId: onDealEvent
      headers:
        x-kafka-topic:
          description: Kafka topic carrying the event.
          schema:
            type: string
            example: deals.tagged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealEvent'
      responses:
        '200':
          description: Event acknowledged.
