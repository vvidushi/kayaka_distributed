[project]
name = "kayak-ai-agent"
version = "2.0.0"
description = "Concierge AI & Health Monitoring Service - Multi-agent travel concierge with deal detection, bundle building, and WebSocket updates"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.9.0",
    "psutil>=5.9.6",
    "sqlmodel>=0.0.14",
    "websockets>=12.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "psycopg2-binary>=2.9.0",
    "redis>=7.0.0",
    "pymongo>=4.6.0",
    "motor>=3.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "tavily-python>=0.3.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "freezegun>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
