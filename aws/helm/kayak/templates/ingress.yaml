{{- if .Values.global.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kayak-ingress
  namespace: {{ .Values.global.project }}-{{ .Values.global.environment }}
  labels:
    {{- include "kayak.labels" . | nindent 4 }}
  annotations:
    {{- range $key, $value := .Values.global.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  rules:
  - http:
      paths:
      # Frontend serves static files and proxies /api and /ws to backend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.frontend.name }}
            port:
              number: {{ .Values.frontend.service.port }}
{{- end }}
