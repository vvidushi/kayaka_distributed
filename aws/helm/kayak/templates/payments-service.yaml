{{- if .Values.paymentsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.paymentsService.name }}
  namespace: {{ .Values.global.project }}-{{ .Values.global.environment }}
  labels:
    {{- include "kayak.labels" . | nindent 4 }}
    app.kubernetes.io/component: payments
spec:
  replicas: {{ .Values.paymentsService.replicaCount }}
  selector:
    matchLabels:
      {{- include "kayak.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: payments
  template:
    metadata:
      labels:
        {{- include "kayak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: payments
    spec:
      containers:
      - name: {{ .Values.paymentsService.name }}
        image: {{ include "kayak.image" (dict "root" . "image" .Values.paymentsService.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.paymentsService.service.targetPort }}
          protocol: TCP
        env:
        {{- range .Values.paymentsService.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        envFrom:
        {{- range .Values.paymentsService.envFrom }}
        - {{ . | toYaml | nindent 10 | trim }}
        {{- end }}
        resources:
          {{- toYaml .Values.paymentsService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.paymentsService.name }}
  namespace: {{ .Values.global.project }}-{{ .Values.global.environment }}
  labels:
    {{- include "kayak.labels" . | nindent 4 }}
    app.kubernetes.io/component: payments
spec:
  type: {{ .Values.paymentsService.service.type }}
  ports:
  - port: {{ .Values.paymentsService.service.port }}
    targetPort: {{ .Values.paymentsService.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    {{- include "kayak.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: payments
{{- end }}
